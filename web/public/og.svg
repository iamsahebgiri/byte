<text x="152" y="106" font-family="Geist Mono" font-size="38" font-weight="600" fill="#f5f5f5">BYTE<tspan fill="#7ee787">.</tspan></text>
<text x="1128" y="100" text-anchor="end" font-family="Geist Mono" font-size="20" xml:space="preserve"><tspan fill="#7ee787">//</tspan><tspan fill="#8a8a8a"> my first programming language, by one person</tspan></text>
<text x="72" y="258" font-family="Geist Mono" font-size="44" font-weight="600" fill="#f5f5f5">I built my first</text>
<text x="72" y="312" font-family="Geist Mono" font-size="44" font-weight="600" fill="#f5f5f5">programming language</text>
<text x="72" y="366" font-family="Geist Mono" font-size="44" font-weight="600" fill="#f5f5f5">in C, from scratch.</text>
<text x="72" y="424" font-family="Geist Mono" font-size="22" fill="#a3a3a3">a scanner, a compiler and a stack VM,</text>
<text x="72" y="456" font-family="Geist Mono" font-size="22" xml:space="preserve"><tspan fill="#a3a3a3"></tspan><tspan fill="#7ee787">2,334</tspan><tspan fill="#a3a3a3"> lines of C, running in your browser.</tspan></text>
<rect x="72" y="560" width="1056" height="1" fill="#272727"/>
<text x="72" y="596" font-family="Geist Mono" font-size="19" fill="#8a8a8a">github.com/iamsahebgiri/byte</text>
<text x="1128" y="596" text-anchor="end" font-family="Geist Mono" font-size="19" xml:space="preserve"><tspan fill="#7ee787">2,334</tspan><tspan fill="#8a8a8a"> lines of C  ·  </tspan><tspan fill="#7ee787">16</tspan><tspan fill="#8a8a8a"> test programs</tspan></text>
