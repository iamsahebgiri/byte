<text x="1092" y="160" text-anchor="end" font-family="Geist Mono" font-size="14" fill="#7ee787">exit 0</text>
<text x="664" y="204.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787">func </tspan><tspan fill="#d2a8ff">fib</tspan><tspan fill="#e5e5e5">(n) {</tspan></text>
<text x="664" y="224.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#e5e5e5">  </tspan><tspan fill="#7ee787">if</tspan><tspan fill="#e5e5e5"> n </tspan><tspan fill="#e5e5e5">&lt;</tspan><tspan fill="#e5e5e5"> </tspan><tspan fill="#f0c674">2</tspan><tspan fill="#e5e5e5"> { </tspan><tspan fill="#7ee787">return</tspan><tspan fill="#e5e5e5"> n }</tspan></text>
<text x="664" y="244.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#e5e5e5">  </tspan><tspan fill="#7ee787">return</tspan><tspan fill="#e5e5e5"> </tspan><tspan fill="#d2a8ff">fib</tspan><tspan fill="#e5e5e5">(n - </tspan><tspan fill="#f0c674">1</tspan><tspan fill="#e5e5e5">)</tspan></text>
<text x="664" y="264.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#e5e5e5">    + </tspan><tspan fill="#d2a8ff">fib</tspan><tspan fill="#e5e5e5">(n - </tspan><tspan fill="#f0c674">2</tspan><tspan fill="#e5e5e5">)</tspan></text>
<text x="664" y="284.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#e5e5e5">}</tspan></text>
<text x="664" y="304.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"></text>
<text x="664" y="324.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787">for</tspan><tspan fill="#e5e5e5"> i = </tspan><tspan fill="#f0c674">0</tspan><tspan fill="#e5e5e5">; i </tspan><tspan fill="#e5e5e5">&lt;</tspan><tspan fill="#e5e5e5"> </tspan><tspan fill="#f0c674">5</tspan><tspan fill="#e5e5e5">; i += </tspan><tspan fill="#f0c674">1</tspan><tspan fill="#e5e5e5"> {</tspan></text>
<text x="664" y="344.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#e5e5e5">  </tspan><tspan fill="#7ee787">print</tspan><tspan fill="#e5e5e5"> </tspan><tspan fill="#d2a8ff">fib</tspan><tspan fill="#e5e5e5">(i)</tspan></text>
<text x="664" y="364.0" font-family="Geist Mono" font-size="13.5" xml:space="preserve"><tspan fill="#e5e5e5">}</tspan></text>
